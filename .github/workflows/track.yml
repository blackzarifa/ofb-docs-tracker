# Runs on GitHub's servers: fetch new Confluence versions, commit them, rebuild and deploy the site.
name: track

on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17 (UTC; GitHub may start it a few minutes late)
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]        # rebuild right away when you edit pages.txt or the scripts

permissions:
  contents: write   # push snapshot commits
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by deploy-pages to prove the deploy comes from this repo

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch new Confluence versions
        run: python3 fetch.py

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot: $(git diff --cached --name-only -- '*.json' | sed -E 's#snapshots/([0-9]+)/v0*([0-9]+)\.json#\1 v\2#' | paste -sd, -)"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            # GitHub disables scheduled workflows in repos with no commits for 60 days.
            git commit --allow-empty -m "Keepalive: no page changes in 45 days"
            git push
          fi

      - name: Build site
        run: python3 build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
